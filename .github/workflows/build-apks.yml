name: Compilar APKs Taxi

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar paquete
        run: |
          sha256sum stage/part-00.b64 stage/part-01.b64 stage/part-02a.b64 stage/part-02b.b64
          wc -c stage/part-00.b64 stage/part-01.b64 stage/part-02a.b64 stage/part-02b.b64
          echo "ac3295327a4eac314d1c18ff977d2380d1b16a46f33f4cae2839aa86e897162d  stage/part-00.b64" | sha256sum -c -
          echo "60442921fee0d8a620ff9333e978c0a9abedf1eacac61e88d824da4c2b3a58bd  stage/part-01.b64" | sha256sum -c -
          echo "d23696e7fcf238fc11898f9f78f8e38bac5be68a47a0bb9228391b8dacf6fb5f  stage/part-02a.b64" | sha256sum -c -
          echo "10df14b80331ccc2a4660f5495bc45496211746f2fca60eaed9558a3bb50c4b7  stage/part-02b.b64" | sha256sum -c -

      - name: Reconstruir proyecto
        run: |
          cat stage/part-00.b64 stage/part-01.b64 stage/part-02a.b64 stage/part-02b.b64 > taxi-stage.b64
          base64 -d taxi-stage.b64 > taxi-stage.tar.gz
          echo "6e370ea1e07d059a89766d24d180fa9ba5f307e19c1f6aec7df997f730a779d5  taxi-stage.tar.gz" | sha256sum -c -
          mkdir app
          tar -xzf taxi-stage.tar.gz -C app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: SDK Android
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Compilar
        working-directory: app
        run: gradle :cliente:assembleDebug :conductor:assembleDebug :central:assembleDebug

      - name: Preparar APKs
        run: |
          mkdir salida
          cp app/cliente/build/outputs/apk/debug/cliente-debug.apk salida/Taxi-Cliente.apk
          cp app/conductor/build/outputs/apk/debug/conductor-debug.apk salida/Taxi-Conductor.apk
          cp app/central/build/outputs/apk/debug/central-debug.apk salida/Taxi-Central.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taxi-Central-APKs
          path: salida/*.apk
