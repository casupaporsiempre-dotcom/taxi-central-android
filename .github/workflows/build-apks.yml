name: Compilar APKs Taxi

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar paquete
        run: |
          echo "Hashes recibidos:"
          sha256sum stage/part-*.b64
          echo "Tamaños recibidos:"
          wc -c stage/part-*.b64
          echo "Hashes esperados:"
          echo "ac3295327a4eac314d1c18ff977d2380d1b16a46f33f4cae2839aa86e897162d  stage/part-00.b64"
          echo "60442921fee0d8a620ff9333e978c0a9abedf1eacac61e88d824da4c2b3a58bd  stage/part-01.b64"
          echo "7adae359a4f4ee25a70c4a9118004a73a1f70b3f49ec4cf7d848a5e4cb0c85cf  stage/part-02.b64"

      - name: Reconstruir proyecto
        run: |
          cat stage/part-*.b64 > taxi-stage.b64
          base64 -d taxi-stage.b64 > taxi-stage.tar.gz
          echo "SHA256 paquete reconstruido:"
          sha256sum taxi-stage.tar.gz
          mkdir app
          tar -xzf taxi-stage.tar.gz -C app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: SDK Android
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Compilar
        working-directory: app
        run: gradle :cliente:assembleDebug :conductor:assembleDebug :central:assembleDebug

      - name: Preparar APKs
        run: |
          mkdir salida
          cp app/cliente/build/outputs/apk/debug/cliente-debug.apk salida/Taxi-Cliente.apk
          cp app/conductor/build/outputs/apk/debug/conductor-debug.apk salida/Taxi-Conductor.apk
          cp app/central/build/outputs/apk/debug/central-debug.apk salida/Taxi-Central.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taxi-Central-APKs
          path: salida/*.apk
